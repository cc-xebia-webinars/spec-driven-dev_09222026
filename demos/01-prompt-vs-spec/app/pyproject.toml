[project]
name = "prompt-built-validator"
version = "0.1.0"
description = "The expense validator a single prompt produced, kept exactly as it came out."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_built"]

[tool.pytest.ini_options]
testpaths = ["tests"]

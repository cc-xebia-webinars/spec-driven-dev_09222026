[project]
name = "expense-policy-validator"
version = "0.1.0"
description = "Validates expense submissions against Acme travel policy rules."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
expense-validate = "expense_validator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "specify-cli==1.0.8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
